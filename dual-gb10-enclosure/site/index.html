  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

  box-shadow: 0 0 0 2px var(--ring);

  padding: 0;

  width: 20px;

}

.form-range::-moz-range-track {
  height: 28px;

&lt;script type=&quot;module&quot;&gt;

  const state = { variant: &quot;open&quot;, view: &quot;assembled&quot;, displaySide: &quot;left&quot; };
  const colors = {

  const scene = new THREE.Scene();

  const hemi = new THREE.HemisphereLight(0xffffff, 0x81878c, 2.2);

  const key = new THREE.DirectionalLight(0xffffff, 4.1);
  key.position.set(-280, 420, -330);

  const floor = new THREE.Mesh(

  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;

  let modelRoot = new THREE.Group();

  const cameraBase = new THREE.Vector3();
  const cameraTarget = new THREE.Vector3();

  function mat(color, opacity = 1, metalness = 0.05, roughness = 0.68) {
    return new THREE.MeshStandardMaterial({
      color,
      opacity,
      transparent: opacity &lt; 1,
      depthWrite: opacity &gt;= 1,
      metalness,
      roughness,
      side: opacity &lt; 1 ? THREE.DoubleSide : THREE.FrontSide,
    });
  }

  function roundedBox(w, h, d, radius, material, position = [0, 0, 0]) {
    const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, radius), material);
    mesh.position.set(...position);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  function cylinder(radius, depth, material, position = [0, 0, 0], axis = &quot;z&quot;) {
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, 40), material);
    if (axis === &quot;z&quot;) mesh.rotation.x = Math.PI / 2;
    if (axis === &quot;x&quot;) mesh.rotation.z = Math.PI / 2;
    mesh.position.set(...position);

  function makeFan(size, thickness, horizontal = false, opacity = 1) {
    const group = new THREE.Group();
    const edge = Math.max(6, size * 0.064);
    const frameMat = mat(colors.black, opacity, 0.04, 0.5);
    const bladeMat = mat(0x111315, opacity &lt; 1 ? opacity * 0.82 : 1, 0.02, 0.38);
    const half = size / 2 - edge / 2;
    group.add(roundedBox(size, edge, thickness, 2, frameMat, [0, half, 0]));
    group.add(roundedBox(size, edge, thickness, 2, frameMat, [0, -half, 0]));
    group.add(roundedBox(edge, size - edge * 2, thickness, 2, frameMat, [half, 0, 0]));
    group.add(roundedBox(edge, size - edge * 2, thickness, 2, frameMat, [-half, 0, 0]));
    const bladeLength = size * 0.34;
    const bladeRadius = size * 0.24;
    for (let index = 0; index &lt; 9; index += 1) {
      const angle = index * Math.PI * 2 / 9;
      const blade = roundedBox(bladeLength, size * 0.085, 3, 3, bladeMat, [
        bladeRadius * Math.cos(angle),
        bladeRadius * Math.sin(angle),
        -1,
      ]);
      blade.rotation.z = angle + 0.48;
      group.add(blade);
    }
    group.add(cylinder(size * 0.12, Math.min(8, thickness), bladeMat, [0, 0, -2]));
    if (horizontal) group.rotation.x = -Math.PI / 2;
    return group;

  function addWaveSlats(group, width, height, z, color, rows = 18, opacity = 1) {
    const slatMat = mat(color, opacity, 0.12, 0.48);
    for (let index = 0; index &lt; rows; index += 1) {

  function makeDevice(side, opacity = 1, offset = new THREE.Vector3()) {
    const group = new THREE.Group();
    const x = side * 29.5;
    const detailOpacity = opacity &lt; 0.2 ? 0.3 : opacity &lt; 1 ? 0.72 : 1;
    group.add(roundedBox(51, 150, 150, 4, mat(colors.device, opacity, 0.08, 0.42), [x, 75, 75]));

    const front = new THREE.Group();
    front.position.set(x, 75, -0.9);
    front.add(roundedBox(45, 144, 2.2, 2.5, mat(colors.gold, detailOpacity, 0.4, 0.35)));
    addWaveSlats(front, 43, 140, -1.5, colors.black, 19, detailOpacity);
    group.add(front);

    const innerX = side * 16.75;
    const outerX = side * 42.25;
    const rearVent = new THREE.Group();
    rearVent.position.set(innerX, 75, 150.9);
    rearVent.add(roundedBox(23, 144, 2.2, 2, mat(colors.gold, detailOpacity, 0.4, 0.35)));
    addWaveSlats(rearVent, 21, 138, 1.4, colors.black, 18, detailOpacity);
    group.add(rearVent);

    const ports = new THREE.Group();
    ports.position.set(outerX, 75, 151.3);
    ports.add(roundedBox(23, 144, 2.4, 2, mat(colors.gold, detailOpacity, 0.4, 0.35)));

    const rear = variant.rear;

  function makeShellOutline(variant) {

  function makeTopGrille(size, y, z) {
    const group = new THREE.Group();
    const frameMat = mat(colors.shellEdge, 1, 0.1, 0.52);
    const slatMat = mat(colors.metal, 1, 0.18, 0.48);

    group.add(roundedBox(size, 3, edge, 1, frameMat, [0, y, z + size / 2 - edge / 2]));
    group.add(roundedBox(edge, 3, size - edge * 2, 1, frameMat, [-size / 2 + edge / 2, y, z]));
    group.add(roundedBox(edge, 3, size - edge * 2, 1, frameMat, [size / 2 - edge / 2, y, z]));
    const rows = Math.max(8, Math.round(size / 7));
    for (let index = 0; index &lt; rows; index += 1) {
      const slatZ = z - size / 2 + 8 + index * (size - 16) / (rows - 1);
      group.add(roundedBox(size - 12, 2.5, 2.4, 0.7, slatMat, [0, y + 0.3, slatZ]));

  function makeRearFrame(variant, opacity = 1) {
    const group = new THREE.Group();
    const frameMat = mat(colors.shellEdge, opacity, 0.08, 0.58);
    const z = variant.rear - 2;
    group.add(roundedBox(152, 6, 6, 2, frameMat, [0, 3, z]));
    group.add(roundedBox(152, 6, 6, 2, frameMat, [0, 153, z]));
    group.add(roundedBox(7, 144, 6, 2, frameMat, [-72.5, 78, z]));
    group.add(roundedBox(7, 144, 6, 2, frameMat, [72.5, 78, z]));
    return group;
  }

  function makeFrontAssembly(exploded = false) {
    const group = new THREE.Group();
    const fan = makeFan(140, 25, false);
    fan.position.set(0, 75, exploded ? -90 : -19);
    group.add(fan);
    const grille = makeFrontGrille(new THREE.Vector3(0, 75, exploded ? -155 : -34));
    group.add(grille);
    return group;
  }

  function makeRearFanGuard(size, z, opacity = 1) {
    const group = new THREE.Group();
    const frameMat = mat(colors.shellEdge, opacity, 0.1, 0.52);
    const slatMat = mat(colors.metal, opacity, 0.16, 0.48);
    const edge = 4;
    const half = size / 2;
    group.add(roundedBox(size, edge, 2.5, 1, frameMat, [0, half - edge / 2, 0]));
    group.add(roundedBox(size, edge, 2.5, 1, frameMat, [0, -half + edge / 2, 0]));
    group.add(roundedBox(edge, size - edge * 2, 2.5, 1, frameMat, [half - edge / 2, 0, 0]));
    group.add(roundedBox(edge, size - edge * 2, 2.5, 1, frameMat, [-half + edge / 2, 0, 0]));
    [-18, -9, 0, 9, 18].forEach((y) =&gt; {
      group.add(roundedBox(size - 9, 1.8, 2, 0.6, slatMat, [0, y, -1.5]));
    });
    group.position.set(0, 75, z);
    return group;
  }

  function makeRearAssist(variant, opacity = 1, exploded = false) {
    const group = new THREE.Group();
    if (state.variant !== &quot;rear60&quot;) return group;

    const frameMat = mat(colors.shellEdge, opacity, 0.08, 0.58);
    const collectorOpacity = state.view === &quot;airflow&quot; ? 0.12 : opacity * 0.48;
    const collectorColor = state.view === &quot;airflow&quot; ? colors.red : colors.shellEdge;
    const collectorMat = mat(collectorColor, collectorOpacity, 0.02, 0.52);
    const bridgeZ = variant.rear + 3.5;
    const fanZ = variant.rear + 16;
    const guardZ = variant.rear + 24.5;

    group.add(roundedBox(4, 150, 17, 1.5, frameMat, [-30, 75, bridgeZ]));
    group.add(roundedBox(4, 150, 17, 1.5, frameMat, [30, 75, bridgeZ]));
    group.add(roundedBox(64, 4, 17, 1.5, frameMat, [0, 3, bridgeZ]));
    group.add(roundedBox(64, 4, 17, 1.5, frameMat, [0, 147, bridgeZ]));
    group.add(roundedBox(56, 58, 13, 3, collectorMat, [0, 75, variant.rear + 1.5]));

    const fan = makeFan(60, 15, false, opacity);
    fan.position.set(0, 75, fanZ);
    group.add(fan);
    group.add(makeRearFanGuard(64, guardZ, opacity));
    if (exploded) group.position.z = 72;
    return group;
  }

  function makeTopHandle(variant, opacity = 1, exploded = false) {
    const group = new THREE.Group();
    if (state.variant !== &quot;rear60&quot;) return group;

    const anchorMat = mat(colors.shellEdge, opacity, 0.12, 0.48);
    const boltMat = mat(colors.metal, opacity, 0.42, 0.3);
    const strapMat = mat(colors.shellEdge, opacity, 0.02, 0.62);
    const topY = variant.height + 3;
    const frontAnchorZ = 28;
    const rearAnchorZ = 122;

    [frontAnchorZ, rearAnchorZ].forEach((z) =&gt; {
      group.add(roundedBox(30, 7, 18, 3, anchorMat, [0, topY, z]));
      group.add(cylinder(3.2, 2.8, boltMat, [0, topY + 4.7, z], &quot;y&quot;));
    });

    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, topY + 3, frontAnchorZ),
      new THREE.Vector3(0, topY + 33, 50),
      new THREE.Vector3(0, topY + 39, 75),
      new THREE.Vector3(0, topY + 33, 100),
      new THREE.Vector3(0, topY + 3, rearAnchorZ),
    ]);
    const strap = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 4.5, 12, false), strapMat);
    strap.castShadow = true;
    group.add(strap);
    if (exploded) group.position.y = 78;
    return group;
  }

  function makeTopAssist(variant, opacity = 1, exploded = false) {
    const group = new THREE.Group();
    if (state.variant === &quot;open&quot; || state.variant === &quot;rear60&quot;) return group;
    const collectorMat = mat(colors.red, state.view === &quot;airflow&quot; ? 0.18 : opacity, 0.02, 0.5);
    const fanY = exploded ? variant.height + 100 : variant.height - 15;
    const grilleY = exploded ? variant.height + 152 : variant.height + 0.5;
    if (state.variant === &quot;top92&quot;) {
      group.add(roundedBox(55, 148, 18, 4, collectorMat, [0, 76, exploded ? 214 : 160]));
      const fan = makeFan(92, 25, true);
      fan.position.set(0, fanY, exploded ? 145 : 124);
      group.add(fan);
      group.add(makeTopGrille(98, grilleY, exploded ? 145 : 124));
    } else {
      [-32, 32].forEach((x) =&gt; {
        group.add(roundedBox(25, 148, 14, 3, collectorMat, [x / 2, 76, exploded ? 208 : 157]));
        const fan = makeFan(60, 15, true);
        fan.position.set(x, fanY, exploded ? 140 : 123);
        group.add(fan);
        group.add(makeTopGrille(64, grilleY, exploded ? 140 : 123).translateX(x));
      });
    }
    return group;
  }

  function makeCable(side, rear) {
    const x = side * 43;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(x, 70, 153),
      new THREE.Vector3(side * 55, 68, rear + 7),
      new THREE.Vector3(side * 63, 52, rear + 34),
    ]);
    const cable = new THREE.Mesh(new THREE.TubeGeometry(curve, 30, 2.6, 9, false), mat(colors.black));
    cable.castShadow = true;
    return cable;
  }

  function flowArrow(from, to, color, radius = 2.6, headRadius = 6.5) {
    const group = new THREE.Group();
    const start = new THREE.Vector3(...from);
    const end = new THREE.Vector3(...to);
    const direction = end.clone().sub(start);
    const length = direction.length();
    direction.normalize();
    const flowMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.92 });
    const shaftLength = Math.max(3, length - 12);
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, shaftLength, 14), flowMat);
    shaft.position.copy(start).add(direction.clone().multiplyScalar(shaftLength / 2));
    shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
    group.add(shaft);
    const head = new THREE.Mesh(new THREE.ConeGeometry(headRadius, 12, 16), flowMat);
    head.position.copy(end).add(direction.clone().multiplyScalar(-6));
    head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
    group.add(head);
    return group;
  }

  function addAirflow(group, variant) {
    if (state.variant === &quot;open&quot; || state.variant === &quot;rear60&quot;) {
      [-29.5, 29.5].forEach((deviceX) =&gt; {
        const exhaustX = Math.sign(deviceX) * 16.75;
        [48, 103].forEach((y) =&gt; {
          group.add(flowArrow([deviceX, y, -96], [deviceX, y, -35], colors.blue));
          group.add(flowArrow([deviceX, y, -8], [deviceX, y, 70], colors.blue));
          group.add(flowArrow([deviceX, y, 62], [exhaustX, y, 142], colors.blue));
          if (state.variant === &quot;rear60&quot;) {
            group.add(flowArrow([exhaustX, y, 132], [exhaustX, y, 165], colors.red, 3.2, 7.5));
            group.add(flowArrow([exhaustX, y, 183], [exhaustX, y, 232], colors.red, 3.2, 7.5));
          } else {
            group.add(flowArrow([exhaustX, y, 132], [exhaustX, y, 238], colors.red, 3.4, 8));
          }
        });
      });
      if (state.variant === &quot;rear60&quot;) {
        [20, 130].forEach((y) =&gt; {
          group.add(flowArrow([0, y, 155], [0, y, 212], colors.red, 1.7, 4.8));
        });
      }
      return;
    }

    [-31, 31].forEach((x) =&gt; {
      [48, 103].forEach((y) =&gt; group.add(flowArrow([x, y, -66], [x, y, 142], colors.blue)));
    });
    if (state.variant === &quot;top92&quot;) {
      [-16, 16].forEach((x) =&gt; {
        group.add(flowArrow([x, 55, 142], [x, 55, 166], colors.red));
        group.add(flowArrow([x, 62, 164], [x, variant.height + 30, 125], colors.red));
      });
    } else {
      [-32, 32].forEach((x) =&gt; {
        group.add(flowArrow([x / 2, 55, 142], [x / 2, 55, 161], colors.red));
        group.add(flowArrow([x / 2, 62, 159], [x, variant.height + 27, 123], colors.red));
      });
    }
  }

  function clearModel() {
    scene.remove(modelRoot);
    modelRoot.traverse((object) =&gt; {
      if (object.geometry) object.geometry.dispose();
      if (object.material) {
        if (Array.isArray(object.material)) object.material.forEach((item) =&gt; item.dispose());
        else object.material.dispose();
      }
    });
    modelRoot = new THREE.Group();
    scene.add(modelRoot);
  }

  function configureCamera(position, target) {
    cameraBase.set(...position);
    cameraTarget.set(...target);
    fitCamera();
  }

  function fitCamera() {
    const rect = stage.getBoundingClientRect();
    const aspect = Math.max(0.45, rect.width / Math.max(rect.height, 1));
    const narrow = aspect &lt; 0.8;
    const scale = narrow ? 1.6 : 1;
    camera.position.copy(cameraTarget).add(cameraBase.clone().sub(cameraTarget).multiplyScalar(scale));
    camera.fov = narrow ? 40 : 34;
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
    controls.target.copy(cameraTarget);
    controls.update();
  }

  function buildAssembled(variant) {
    const displaySide = state.displaySide === &quot;left&quot; ? -1 : 1;
    modelRoot.add(makeShell(variant, 1, false));
    modelRoot.add(makeDevice(-1));
    modelRoot.add(makeDevice(1));
    modelRoot.add(makeRearFrame(variant));
    modelRoot.add(makeFrontAssembly(false));
    modelRoot.add(makeTopAssist(variant, 1, false));
    modelRoot.add(makeRearAssist(variant, 1, false));
    modelRoot.add(makeTopHandle(variant, 1, false));
    modelRoot.add(makeDisplay(displaySide));
    configureCamera([displaySide * 310, 235, -330], [0, 82, 62]);
  }

  function buildAirflow(variant) {
    const isStraightThrough = state.variant === &quot;open&quot; || state.variant === &quot;rear60&quot;;
    modelRoot.add(makeShell(variant, isStraightThrough ? 0.035 : 0.11, false));
    if (isStraightThrough) modelRoot.add(makeShellOutline(variant));
    modelRoot.add(makeDevice(-1, isStraightThrough ? 0.16 : 0.38));
    modelRoot.add(makeDevice(1, isStraightThrough ? 0.16 : 0.38));
    modelRoot.add(makeRearFrame(variant, isStraightThrough ? 0.22 : 0.3));
    const fan = makeFan(140, 25, false, isStraightThrough ? 0.48 : 1);
    fan.position.set(0, 75, -19);
    modelRoot.add(fan);
    modelRoot.add(makeTopAssist(variant, 0.22, false));
    modelRoot.add(makeRearAssist(variant, 1, false));
    modelRoot.add(makeTopHandle(variant, 0.65, false));
    if (!isStraightThrough) {
      modelRoot.add(makeCable(-1, variant.rear));
      modelRoot.add(makeCable(1, variant.rear));
    }
    addAirflow(modelRoot, variant);
    configureCamera(isStraightThrough ? [-330, 280, -350] : [-410, 230, -125], [0, 85, 70]);
  }

  function buildRear(variant) {
    modelRoot.add(makeShell(variant, 0.24, false));
    modelRoot.add(makeDevice(-1));
    modelRoot.add(makeDevice(1));
    modelRoot.add(makeRearFrame(variant));
    modelRoot.add(makeTopAssist(variant, 0.72, false));
    modelRoot.add(makeRearAssist(variant, 1, false));
    modelRoot.add(makeTopHandle(variant, 1, false));
    modelRoot.add(makeCable(-1, variant.rear));
    modelRoot.add(makeCable(1, variant.rear));
    configureCamera(
      state.variant === &quot;rear60&quot; ? [0, 180, 460] : [270, 205, 345],
      [0, 78, state.variant === &quot;rear60&quot; ? 154 : 138]
    );
  }

  function buildExploded(variant) {
    const displaySide = state.displaySide === &quot;left&quot; ? -1 : 1;
    modelRoot.add(makeShell(variant, 1, true));
    modelRoot.add(makeFrontAssembly(true));
    const leftDevice = makeDevice(-1, 1, new THREE.Vector3(-34, 10, 0));
    const rightDevice = makeDevice(1, 1, new THREE.Vector3(34, 10, 0));
    modelRoot.add(leftDevice, rightDevice);
    modelRoot.add(makeRearFrame(variant, 1));
    modelRoot.add(makeTopAssist(variant, 0.68, true));
    modelRoot.add(makeRearAssist(variant, 1, true));
    modelRoot.add(makeTopHandle(variant, 1, true));
    const display = makeDisplay(
      displaySide,
      1,
      new THREE.Vector3(displaySide * 88, 18, 0)
    );
    modelRoot.add(display);
    configureCamera(
      [displaySide * 650, 470, state.variant === &quot;rear60&quot; ? 720 : -720],
      [0, 100, 50]
    );
  }

  function updateStatus(variant) {
    const viewLabels = {
      assembled: &quot;完成视图&quot;,
      airflow: state.variant === &quot;open&quot;
        ? &quot;前置 140 mm 进风 → 双机贯流 → 后部中央直排&quot;
        : state.variant === &quot;rear60&quot;
          ? &quot;前置 140 mm 进风 → 双机贯流 → 后置 60 mm 抽排 / 上下旁通&quot;
          : &quot;蓝色进风 / 红色排风&quot;,
      rear: &quot;外侧接口 / 中央排风&quot;,
      exploded: &quot;模块分件&quot;,
    };
    const displayLabel = state.displaySide === &quot;left&quot; ? &quot;显示屏左侧&quot; : &quot;显示屏右侧&quot;;
    status.textContent = `${variant.label} · 152 W × ${variant.depth} D × ${variant.height} H mm · ${variant.externalFans} · ${displayLabel} · ${viewLabels[state.view]}`;
    const summary = `${variant.label}. ${variant.description}. Envelope 152 by ${variant.depth} by ${variant.height} millimeters. ${variant.externalFans}. ${displayLabel}.`;
    accessibleSummary.textContent = summary;
    canvas.setAttribute(&quot;aria-label&quot;, `${summary} Current view: ${viewLabels[state.view]}. Drag to rotate and scroll to zoom.`);
  }

  function rebuild() {
    clearModel();
    const variant = variants[state.variant];
    floor.position.y = state.view === &quot;exploded&quot; ? -35 : -3;
    if (state.view === &quot;airflow&quot;) buildAirflow(variant);
    else if (state.view === &quot;rear&quot;) buildRear(variant);
    else if (state.view === &quot;exploded&quot;) buildExploded(variant);
    else buildAssembled(variant);
    updateStatus(variant);
  }

  function setPressed(selector, value, attribute) {
    root.querySelectorAll(selector).forEach((button) =&gt; {
      const selected = button.dataset[attribute] === value;
      button.setAttribute(&quot;aria-pressed&quot;, String(selected));
      button.classList.toggle(&quot;btn-primary&quot;, selected);
    });
  }

  root.querySelectorAll(&quot;[data-variant]&quot;).forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      state.variant = button.dataset.variant;
      setPressed(&quot;[data-variant]&quot;, state.variant, &quot;variant&quot;);
      rebuild();
    });
  });

  root.querySelectorAll(&quot;[data-view]&quot;).forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      state.view = button.dataset.view;
      setPressed(&quot;[data-view]&quot;, state.view, &quot;view&quot;);
      rebuild();
    });
  });

  root.querySelectorAll(&quot;[data-display-side]&quot;).forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      state.displaySide = button.dataset.displaySide;
      setPressed(&quot;[data-display-side]&quot;, state.displaySide, &quot;displaySide&quot;);
      rebuild();
    });
  });

  const resizeObserver = new ResizeObserver(() =&gt; {
    const rect = stage.getBoundingClientRect();
    renderer.setSize(Math.max(1, rect.width), Math.max(1, rect.height), false);
    fitCamera();
  });
  resizeObserver.observe(stage);

  function animate() {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  try {
    rebuild();
    animate();
    window.__DUAL_GB10_OPTIONS_READY__ = true;
  } catch (error) {
    window.__DUAL_GB10_OPTIONS_ERROR__ = { message: error.message, stack: error.stack };
    status.textContent = `渲染错误：${error.message}`;
    throw error;
  }

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(() =&gt; {

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
