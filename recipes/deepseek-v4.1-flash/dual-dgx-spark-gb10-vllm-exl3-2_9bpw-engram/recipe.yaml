    "Context capped at 300k by this kit's 119.63 GiB UMA envelope at GPU_MEM_UTIL 0.84; 0.86 aborts on host memory during large-image vision workloads.",
    "Long-prompt prefill is intentionally conservative (MAX_NUM_BATCHED_TOKENS=1536); the prefill ladder aborts at the 32k rung under the memory guard, so cold ingest beyond ~16k is not a strength of this profile.",
    "Engram tables require the native checkpoint's shards 47/48 plus its config.json alongside the EXL3 tree; the upstream download recipe omits config.json and the boot fails without it.",
