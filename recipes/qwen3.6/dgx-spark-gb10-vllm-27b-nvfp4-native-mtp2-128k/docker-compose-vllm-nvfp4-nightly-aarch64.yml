services:
  vllm-qwen36-nvfp4-nightly-aarch64:
    image: vllm/vllm-openai:nightly-aarch64
    container_name: vllm-qwen36-nvfp4-nightly-aarch64
    restart: unless-stopped
    ports:
      - "8004:8000"
    volumes:
      - /home/YOUR_USERNAME/models/Qwen3.6-35B-A3B-NVFP4:/models:ro
      - /home/YOUR_USERNAME/.cache/huggingface:/root/.cache/huggingface
      - /home/YOUR_USERNAME/.cache/vllm:/root/.cache/vllm
      - /home/YOUR_USERNAME/.cache/flashinfer:/root/.cache/flashinfer
      - /home/YOUR_USERNAME/.triton:/root/.triton
    environment:
      - HF_HOME=/root/.cache/huggingface
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_HOST_IP=127.0.0.1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host
    shm_size: 64gb
    command:
      - /models
      - --served-model-name
      - qwen3.6-35b-fp8
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --attention-backend
      - flashinfer
      - --moe-backend
      - marlin
      - --gpu-memory-utilization
      - "0.40"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "4"
      - --max-num-batched-tokens
      - "8192"
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      - --load-format
      - fastsafetensors
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_xml
      - --enable-auto-tool-choice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

networks:
  default:
    name: vllm-qwen36-nvfp4-nightly-aarch64-network
