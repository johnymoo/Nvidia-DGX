version: '3.8'

services:
  pdf2md-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdf2md:latest
    container_name: pdf2md-api
    ports:
      - "21212:9999"
    volumes:
      # Mount HuggingFace cache to persist models
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Mount working directory for file access
      - ~/workspace:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
