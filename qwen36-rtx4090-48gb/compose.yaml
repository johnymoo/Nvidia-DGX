name: qwen36-rtx4090

services:
  ollama:
    image: ollama/ollama:0.20.2
    container_name: qwen36-rtx4090-ollama
    restart: unless-stopped
    ports:
      - "0.0.0.0:8004:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "131072"
      OLLAMA_KEEP_ALIVE: "24h"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  model-bootstrap:
    image: ollama/ollama:0.20.2
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen3.6:27b
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-ec", "ollama pull \"$${OLLAMA_MODEL}\""]
    restart: "no"

volumes:
  ollama-models:
    name: qwen36-rtx4090-ollama-models
